# Só os testes de REGRA PURA rodam no pytest — os que não precisam de banco
# nem de Django configurado. São rápidos (centésimos de segundo) e servem de
# feedback imediato enquanto se mexe na projeção ou na leitura do QR Code.
#
# Os testes que tocam o ORM rodam no runner do Django:
#     python manage.py test apps
#
# A alternativa seria adicionar pytest-django e unificar, ao custo de mais uma
# dependência. Como a divisão é natural aqui (regra pura x integração), fica
# assim até haver motivo para mudar.
[pytest]
testpaths =
    apps/contratos/tests/test_projecao.py
    apps/fiscal/tests/test_nfce_qrcode.py
python_files = test_*.py
addopts = -q
