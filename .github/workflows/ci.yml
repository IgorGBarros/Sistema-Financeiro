name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Checagem do Django
        run: python manage.py check

      # Migration esquecida quebra o deploy, não a suíte. Melhor falhar aqui.
      - name: Migrations em dia
        run: python manage.py makemigrations --check --dry-run

      - name: Testes de regra (sem banco)
        run: python -m pytest

      - name: Testes com banco
        run: python manage.py test apps --verbosity 2

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Checagem de tipos
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
